[project]
name = "es_reading"
authors = [{ name = "Enterprise Systems Australia" }]
description = "Read-along app that helps young children learn to read from PDFs"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
